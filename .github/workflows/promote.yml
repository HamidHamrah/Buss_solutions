name: Promote main to customer(s)

# The only thing that ever pushes to a deploy/<slug> branch. Moving that
# branch forward triggers a customer's Render redeploy; the matching Cloudflare
# workflow is dispatched explicitly on that branch — so this is the
# canary/staged-rollout lever: promote one
# customer, watch it, then promote the rest individually or all at once.
#
# Always a plain (non-force) push, since nothing should ever commit directly
# to a deploy/<slug> branch — if a plain push isn't a fast-forward, that
# means something unexpected landed on the branch, and this fails loudly
# instead of silently overwriting it.
on:
  workflow_dispatch:
    inputs:
      customer:
        description: 'Which customer to promote'
        required: true
        type: choice
        options:
          - kjosavik
          - nidaros
          - teamtour
          - haga
          - all

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote selected customer(s)
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOMER: ${{ inputs.customer }}
        run: |
          set -e
          ALL_SLUGS="kjosavik nidaros teamtour haga"
          if [ "$CUSTOMER" = "all" ]; then
            SLUGS="$ALL_SLUGS"
          else
            SLUGS="$CUSTOMER"
          fi
          for slug in $SLUGS; do
            echo "Promoting main -> deploy/$slug"
            git push origin "main:deploy/$slug"
            # GITHUB_TOKEN pushes do not trigger push workflows; dispatch explicitly.
            gh workflow run "deploy-$slug.yml" --ref "deploy/$slug"
          done
