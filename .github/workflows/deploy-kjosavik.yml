name: Deploy Kjosavik frontend

# Bus_Solution serves multiple customers from one repo. This workflow only
# triggers on pushes to deploy/kjosavik (not main), so it never fires for
# other customers' changes — see .github/workflows/promote.yml, which is the
# only thing that pushes to this branch. The backend deploys separately via
# Render's own git integration (see render.yaml's per-service `branch:`),
# which follows the same one-customer-per-branch gating.
on:
  push:
    branches: [deploy/kjosavik]
    paths-ignore:
      - 'backend/**'

env:
  CUSTOMER_SLUG: kjosavik

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (runs apply-customer.mjs via the npm prebuild hook)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # wrangler-action's own default (3.90.0) only auto-discovers wrangler.toml,
          # not wrangler.json — pin to v4, which auto-discovers .json correctly
          # (confirmed locally; passing --config explicitly instead would also work
          # but pinning avoids depending on an old version's discovery quirks).
          wranglerVersion: '4'
