# Multi-service Blueprint: one service + database per customer, each pinned to
# its own deploy/<slug> branch so a Render redeploy only ever affects that one
# customer. See scripts/stamp-deploy.mjs's comment header for why this file is
# no longer stamped per-deploy — it's now a static, permanent definition.
#
# This is a fresh, parallel set of services for all four customers — none of
# them reuse an existing live service/Worker name. Each of the four already
# has its own real, currently-working deployment elsewhere (Kjosavik's real
# backend is Blueprint-managed from the separate Kjosavik_Reiser repo; Team
# Tour and Haga each have their own live Render service + Cloudflare Worker
# under their original standalone repos) — those stay exactly as they are,
# untouched. Everything below is new infrastructure for the Bus_Solution
# template; cutting a customer over to it for real is a separate, deliberate
# future decision, not a side effect of this Blueprint.
databases:
  - name: kjosavik-staging-db
    plan: free
  - name: nidaros-staging-db
    plan: free
  - name: team-tour-staging-db
    plan: free
  - name: haga-staging-db
    plan: free

services:
  - name: kjosavik-reiser-api-staging
    type: web
    runtime: docker
    branch: deploy/kjosavik
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Customer__Slug
        value: kjosavik
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: kjosavik-staging-db
          property: connectionString
      - key: Cors__AllowedOrigins__0
        value: https://kjosavik-reiser-staging.s362052.workers.dev
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: kjosavik-api
      - key: Jwt__Audience
        value: kjosavik-web
      - key: Email__Host
        sync: false
      - key: Email__Port
        sync: false
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        value: post@kjosavikreiser.no
      - key: Email__FromName
        value: Kjosavik Reiser AS
      - key: Email__NotifyTo
        value: post@kjosavikreiser.no
      - key: Twilio__AccountSid
        sync: false
      - key: Twilio__AuthToken
        sync: false
      - key: Twilio__FromNumber
        sync: false

